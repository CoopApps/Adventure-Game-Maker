[package]
name = "retroquest"
version = "0.1.0"
edition = "2021"
authors = ["RetroQuest Team"]
description = "A no-code adventure game maker with Quest for Glory mechanics"
license = "MIT"

[dependencies]
# Core Bevy
bevy = { version = "0.14", features = ["dynamic_linking"] }

# UI Framework
bevy_egui = "0.28"
egui = "0.28"
egui_extras = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"

# File System
rfd = "0.14" # Native file dialogs

# Audio (when needed)
bevy_kira_audio = "0.20"

# Localization (when needed)
# bevy_fluent = "0.9"
# unic-langid = "0.9"

# Performance
bevy_framepace = "0.17"

[dev-dependencies]
bevy-inspector-egui = "0.25"

[profile.dev]
opt-level = 1 # Faster debug builds

[profile.dev.package."*"]
opt-level = 3 # But keep dependencies optimized

[profile.release]
lto = true
codegen-units = 1
strip = true

# Enable faster compile times
[profile.dev.build-override]
opt-level = 3
